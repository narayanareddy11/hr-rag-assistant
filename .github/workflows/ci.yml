name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile rag-test.py streamlit_app.py document_poc.py

      - name: Run document POC smoke test
        run: |
          python document_poc.py --query "annual leave refund onboarding"

      - name: Optional Replit smoke test
        env:
          REPLIT_APP_URL: ${{ secrets.REPLIT_APP_URL }}
          REPLIT_ACCESS_TOKEN: ${{ secrets.REPLIT_ACCESS_TOKEN }}
        run: |
          if [ -z "$REPLIT_APP_URL" ]; then
            echo "REPLIT_APP_URL is not set; skipping Replit smoke test."
            exit 0
          fi

          if [ -n "$REPLIT_ACCESS_TOKEN" ]; then
            curl -fsS -H "Authorization: Bearer $REPLIT_ACCESS_TOKEN" "$REPLIT_APP_URL" >/dev/null
          else
            curl -fsS "$REPLIT_APP_URL" >/dev/null
          fi
