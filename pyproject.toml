[project]
name = "rag-01"
version = "0.1.0"
description = "LangGraph RAG assistant with ChromaDB and Gemini"
readme = "README.md"
authors = [
    { name = "Venkata Narayana Reddy Mandhati", email = "narayanareddy99910@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.16",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.2.11",
    "streamlit>=1.40.0",
]

[project.scripts]
rag-01 = "rag_01:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
